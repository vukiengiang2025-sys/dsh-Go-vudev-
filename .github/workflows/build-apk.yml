name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      flavor:
        description: Target ABI flavor
        required: true
        default: arm64
        type: choice
        options:
          - arm64
          - x64

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
  NODE_VERSION: 24.22.1
  GRADLE_VERSION: 9.3.1
  DSH_MAVEN_MIRRORS: 0
  TZ: Asia/Shanghai

jobs:
  build-apk:
    name: Build APK (${{ inputs.flavor || 'arm64' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Prepare Flutter dependencies and Android config
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
          if [ ! -f android/gradlew ]; then
            (cd android && gradle wrapper --gradle-version "${GRADLE_VERSION}")
          fi

      - name: Build runtime bundle
        run: |
          FLAVOR="${{ inputs.flavor || 'arm64' }}"
          if [ "$FLAVOR" = "x64" ]; then
            bash runtime/build-runtime.sh x86_64
          else
            bash runtime/build-runtime.sh arm64-v8a
          fi

      - name: Build release APK
        run: |
          FLAVOR="${{ inputs.flavor || 'arm64' }}"
          DSH_BETA_TOKEN_FILE= bash tooling/build-apk.sh -f "$FLAVOR" --no-companion

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsh-go-${{ inputs.flavor || 'arm64' }}-apk
          path: app/build/app/outputs/flutter-apk/
          if-no-files-found: error
